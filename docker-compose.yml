services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: reservas_gym
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: laravel
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  app:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  db_data:
